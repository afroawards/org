<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IKWUANO DIGITAL RADIO — Live Player</title>
<style>
  /* ============================================================
     STREAM CONFIG — developer edits ONLY this block to point the
     player at any Shoutcast/Icecast source (new IP, port, mount).
     ============================================================ */
</style>
</head>
<body>

<script>
/* =====================================================================
   STREAM CONFIGURATION
   Change these three values to move the player to a new server at will.
   No other code needs to be touched.
   ===================================================================== */
const STREAM_CONFIG = {
  PROTOCOL: "http",              // "http" or "https" (https requires a valid cert on the stream host)
  IP: "198.27.127.246",          // Shoutcast/Icecast server IP or domain
  PORT: "26310",                 // Streaming port
  MOUNT: "/listen.mp3",          // Mount point / stream path (Shoutcast v2 style; v1 servers often use "/;")
  STATUS_XML: "/status-json.xsl" // Optional: Shoutcast v2 status endpoint for "Now Playing" (leave blank to disable)
};

function buildStreamUrl(cfg) {
  return `${cfg.PROTOCOL}://${cfg.IP}:${cfg.PORT}${cfg.MOUNT}`;
}
</script>

<style>
  :root{
    --ink:#0e1b12;
    --paper:#f6f3ea;
    --broadcast-green:#0f4d2e;
    --signal-gold:#d1a13e;
    --live-red:#c23b2f;
    --line:rgba(14,27,18,0.14);
    --display: "Fraunces", Georgia, serif;
    --body: "Inter", -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(circle at 15% 10%, rgba(209,161,62,0.10), transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:var(--body);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:32px 16px;
  }

  .set{
    width:100%;
    max-width:460px;
    background:var(--ink);
    border-radius:18px;
    padding:28px 26px 24px;
    color:var(--paper);
    position:relative;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(14,27,18,0.5);
  }
  .set::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(90deg, rgba(246,243,234,0.035) 0 1px, transparent 1px 40px),
      repeating-linear-gradient(0deg, rgba(246,243,234,0.035) 0 1px, transparent 1px 40px);
    pointer-events:none;
  }

  .top{
    display:flex; align-items:flex-start; justify-content:space-between;
    position:relative; z-index:1;
    margin-bottom:22px;
  }
  .brand-mark{display:flex; align-items:center; gap:10px;}
  .brand-mark .dot{
    width:10px; height:10px; border-radius:50%;
    background:var(--signal-gold);
  }
  .brand small{
    display:block; font-family:var(--mono); font-size:10.5px;
    letter-spacing:0.14em; text-transform:uppercase;
    color:rgba(246,243,234,0.55);
  }
  .brand h1{
    font-family:var(--display); font-weight:600; font-size:22px;
    letter-spacing:-0.01em; margin-top:2px;
  }

  .live-chip{
    display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:11px; letter-spacing:0.08em;
    padding:6px 10px; border-radius:999px;
    border:1px solid rgba(246,243,234,0.18);
    height:fit-content;
  }
  .live-chip .pulse{
    width:7px; height:7px; border-radius:50%;
    background:var(--live-red);
    animation:pulse 1.6s ease-in-out infinite;
  }
  .live-chip.offline .pulse{ background:rgba(246,243,234,0.3); animation:none; }
  @keyframes pulse{
    0%,100%{opacity:1; box-shadow:0 0 0 0 rgba(194,59,47,0.5);}
    50%{opacity:0.55; box-shadow:0 0 0 6px rgba(194,59,47,0);}
  }

  /* spectrum */
  .scope{
    position:relative; z-index:1;
    height:96px;
    border-radius:12px;
    background:linear-gradient(180deg, rgba(246,243,234,0.05), rgba(246,243,234,0.02));
    border:1px solid rgba(246,243,234,0.1);
    margin-bottom:20px;
    overflow:hidden;
  }
  #bars{ width:100%; height:100%; display:block; }

  .freq-line{
    display:flex; justify-content:space-between;
    font-family:var(--mono); font-size:9.5px; letter-spacing:0.06em;
    color:rgba(246,243,234,0.4);
    margin-top:6px; margin-bottom:18px;
    position:relative; z-index:1;
  }

  .now{
    position:relative; z-index:1;
    display:flex; flex-direction:column; gap:3px;
    margin-bottom:20px;
  }
  .now .label{
    font-family:var(--mono); font-size:10px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--signal-gold);
  }
  .now .track{
    font-family:var(--display); font-size:17px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .now .sub{
    font-size:12.5px; color:rgba(246,243,234,0.55);
  }

  .controls{
    position:relative; z-index:1;
    display:flex; align-items:center; gap:16px;
  }
  .play-btn{
    width:56px; height:56px; border-radius:50%;
    background:var(--signal-gold);
    border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .play-btn:hover{ transform:scale(1.05); }
  .play-btn:active{ transform:scale(0.96); }
  .play-btn svg{ width:20px; height:20px; }

  .vol-wrap{ flex:1; display:flex; align-items:center; gap:10px; }
  .vol-wrap svg{ width:16px; height:16px; opacity:0.6; flex-shrink:0; }
  input[type="range"]{
    -webkit-appearance:none; appearance:none;
    width:100%; height:3px; border-radius:2px;
    background:rgba(246,243,234,0.2);
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:13px; height:13px; border-radius:50%;
    background:var(--paper); cursor:pointer;
    border:2px solid var(--broadcast-green);
  }

  .foot{
    position:relative; z-index:1;
    margin-top:20px; padding-top:14px;
    border-top:1px solid rgba(246,243,234,0.1);
    display:flex; justify-content:space-between; align-items:center;
    font-family:var(--mono); font-size:10px; letter-spacing:0.05em;
    color:rgba(246,243,234,0.4);
  }
  .foot button{
    background:none; border:1px solid rgba(246,243,234,0.18);
    color:rgba(246,243,234,0.7);
    font-family:var(--mono); font-size:10px;
    padding:5px 9px; border-radius:6px; cursor:pointer;
  }
  .foot button:hover{ border-color:rgba(246,243,234,0.4); color:var(--paper); }

  .status-msg{
    font-family:var(--mono); font-size:11px;
    color:var(--signal-gold); margin-top:8px; min-height:14px;
    position:relative; z-index:1;
  }

  @media (prefers-reduced-motion: reduce){
    .live-chip .pulse{ animation:none; }
  }
</style>

<div class="set" role="region" aria-label="IkwuanoRADIO Digitally powered by Ikwuano Ambassadors live player">

  <div class="top">
    <div class="brand-mark">
      <div>
        <small>Ikwuano Digital Radio and IkwuanoTV</small>
        <h1>IkwuanoRADIO Digitally powered by Ikwuano Ambassadors</h1>
      </div>
    </div>
    <div class="live-chip offline" id="liveChip">
      <span class="pulse"></span>
      <span id="liveLabel">OFFLINE</span>
    </div>
  </div>

  <div class="scope">
    <canvas id="bars"></canvas>
  </div>
  <div class="freq-line">
    <span>60Hz</span><span>250Hz</span><span>1kHz</span><span>4kHz</span><span>12kHz</span>
  </div>

  <div class="now">
    <span class="label">On Air</span>
    <span class="track" id="nowTrack">Ikwuano RADIO 108.7 FM — Live Stream</span>
    <span class="sub" id="nowSub">Tap play to connect to the live signal</span>
  </div>

  <div class="controls">
    <button class="play-btn" id="playBtn" aria-label="Play">
      <svg id="playIcon" viewBox="0 0 24 24" fill="#0e1b12"><path d="M8 5v14l11-7z"/></svg>
      <svg id="pauseIcon" viewBox="0 0 24 24" fill="#0e1b12" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <div class="vol-wrap">
      <svg viewBox="0 0 24 24" fill="#f6f3ea"><path d="M3 10v4h4l5 5V5L7 10H3z"/></svg>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.85" aria-label="Volume">
    </div>
  </div>

  <div class="status-msg" id="statusMsg"></div>

  <div class="foot">
    <span id="streamUrlLabel">—</span>
    <button id="reconnectBtn">Reconnect</button>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
(function(){
  const streamUrl = buildStreamUrl(STREAM_CONFIG);
  document.getElementById('streamUrlLabel').textContent =
    STREAM_CONFIG.IP + ':' + STREAM_CONFIG.PORT + STREAM_CONFIG.MOUNT;

  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');
  const volume = document.getElementById('volume');
  const liveChip = document.getElementById('liveChip');
  const liveLabel = document.getElementById('liveLabel');
  const statusMsg = document.getElementById('statusMsg');
  const nowSub = document.getElementById('nowSub');
  const reconnectBtn = document.getElementById('reconnectBtn');

  audio.volume = parseFloat(volume.value);
  audio.crossOrigin = "anonymous";

  let isPlaying = false;
  let audioCtx, analyser, source, dataArray, rafId;

  function setLive(on){
    liveChip.classList.toggle('offline', !on);
    liveLabel.textContent = on ? 'LIVE' : 'OFFLINE';
  }

  function loadStream(){
    audio.src = streamUrl + (streamUrl.includes('?') ? '&' : '?') + 'cb=' + Date.now();
  }

  function togglePlay(){
    if (!isPlaying){
      statusMsg.textContent = 'Connecting to stream…';
      if (!audio.src) loadStream();
      audio.play().then(()=>{
        isPlaying = true;
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
        setLive(true);
        statusMsg.textContent = '';
        nowSub.textContent = 'Streaming live — SMA 104.7 FM';
        initVisualizer();
      }).catch(err=>{
        statusMsg.textContent = 'Could not connect — check stream server / CORS settings.';
        setLive(false);
      });
    } else {
      audio.pause();
      isPlaying = false;
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
      setLive(false);
      nowSub.textContent = 'Paused';
      cancelAnimationFrame(rafId);
    }
  }

  playBtn.addEventListener('click', togglePlay);
  volume.addEventListener('input', ()=>{ audio.volume = parseFloat(volume.value); });

  reconnectBtn.addEventListener('click', ()=>{
    isPlaying = false;
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
    setLive(false);
    playIcon.style.display = 'block';
    pauseIcon.style.display = 'none';
    statusMsg.textContent = 'Stream reset. Press play to reconnect.';
  });

  audio.addEventListener('stalled', ()=>{ statusMsg.textContent = 'Buffering…'; });
  audio.addEventListener('waiting', ()=>{ statusMsg.textContent = 'Buffering…'; });
  audio.addEventListener('playing', ()=>{ statusMsg.textContent = ''; });
  audio.addEventListener('error', ()=>{
    statusMsg.textContent = 'Stream error — verify IP/port/mount are correct and reachable.';
    setLive(false);
    isPlaying = false;
    playIcon.style.display = 'block';
    pauseIcon.style.display = 'none';
  });

  /* ---------- spectrum visualizer ---------- */
  const canvas = document.getElementById('bars');
  const ctx2d = canvas.getContext('2d');
  function resizeCanvas(){
    canvas.width = canvas.clientWidth * devicePixelRatio;
    canvas.height = canvas.clientHeight * devicePixelRatio;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function initVisualizer(){
    if (audioCtx) { drawIdleOrLive(); return; }
    try{
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      source = audioCtx.createMediaElementSource(audio);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 128;
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      drawIdleOrLive();
    }catch(e){
      // Some CORS-restricted streams block AnalyserNode; fall back to ambient animation
      drawAmbient();
    }
  }

  function drawIdleOrLive(){
    if (!isPlaying){ ctx2d.clearRect(0,0,canvas.width,canvas.height); return; }
    analyser.getByteFrequencyData(dataArray);
    renderBars(dataArray);
    rafId = requestAnimationFrame(drawIdleOrLive);
  }

  function drawAmbient(){
    if (!isPlaying) { ctx2d.clearRect(0,0,canvas.width,canvas.height); return; }
    const fake = new Uint8Array(32).map(()=> 40 + Math.random()*160);
    renderBars(fake);
    rafId = requestAnimationFrame(drawAmbient);
  }

  function renderBars(data){
    const w = canvas.width, h = canvas.height;
    ctx2d.clearRect(0,0,w,h);
    const barCount = 32;
    const step = Math.floor(data.length / barCount) || 1;
    const barW = w / barCount;
    for (let i=0;i<barCount;i++){
      const v = data[i*step] / 255;
      const barH = Math.max(v * h * 0.9, h*0.03);
      const x = i * barW;
      const grad = ctx2d.createLinearGradient(0, h-barH, 0, h);
      grad.addColorStop(0, '#d1a13e');
      grad.addColorStop(1, '#0f4d2e');
      ctx2d.fillStyle = grad;
      ctx2d.fillRect(x + barW*0.18, h - barH, barW*0.64, barH);
    }
  }
})();
</script>

</body>
</html>
